<title>Matric English Guide</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:wght@600;700&family=Noto+Sans+Myanmar:wght@400;700&display=swap">
<style>
/* Layout: one narrow column built for a phone. Home → Study Guide or one of three papers. */
:root{
  --bg:#F2F5F4; --surface:#FFFFFF; --ink:#14202A; --muted:#566570; --line:#D8DFE3;
  --accent:#0B6B6B; --accent-ink:#FFFFFF; --accent-soft:#DCEFEE;
  --good:#17703F; --good-bg:#E1F3E8; --bad:#B3261E; --bad-bg:#FBE5E3;
  --warn:#7A5200; --warn-bg:#FFF0CF; --hl:#FFE680;
  --f-body:'Atkinson Hyperlegible',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-head:'Bricolage Grotesque','Atkinson Hyperlegible',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1418; --surface:#162026; --ink:#E7EEF2; --muted:#9BAAB4; --line:#2A3741;
  --accent:#5CC8C4; --accent-ink:#06201F; --accent-soft:#17343A;
  --good:#6FD9A0; --good-bg:#12301F; --bad:#FF918A; --bad-bg:#3B1715;
  --warn:#F3C86F; --warn-bg:#3A2D10; --hl:#6B5A10; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1418; --surface:#162026; --ink:#E7EEF2; --muted:#9BAAB4; --line:#2A3741;
  --accent:#5CC8C4; --accent-ink:#06201F; --accent-soft:#17343A;
  --good:#6FD9A0; --good-bg:#12301F; --bad:#FF918A; --bad-bg:#3B1715;
  --warn:#F3C86F; --warn-bg:#3A2D10; --hl:#6B5A10; color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font:17px/1.55 var(--f-body);padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px));padding-block:0 48px;margin:0}
.wrap{max-width:720px;margin:0 auto}
h1,h2,h3{font-family:var(--f-head);line-height:1.2;margin:0;text-wrap:balance}
h1{font-size:30px}h2{font-size:22px}h3{font-size:18px}
p{margin:0 0 .8em}
a{color:var(--accent)}
button,select,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);margin-inline:calc(-1*max(16px,env(safe-area-inset-left,0px)));padding:10px max(16px,env(safe-area-inset-left,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
.top .wrap{display:flex;align-items:center;gap:10px;min-height:36px}
.brand{font-family:var(--f-head);font-weight:700;font-size:17px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn{border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 14px;cursor:pointer;min-height:44px}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.btn.sm{min-height:38px;padding:6px 12px;font-size:15px}
.btn:disabled{opacity:.5;cursor:default}
.score{font-weight:700;font-variant-numeric:tabular-nums;font-size:15px;background:var(--accent-soft);color:var(--ink);padding:5px 10px;border-radius:99px;white-space:nowrap}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 0 4px;scrollbar-width:thin}
.chip{flex:none;border:1.5px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 14px;cursor:pointer;font-size:15px;min-height:40px}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.chip .d{font-variant-numeric:tabular-nums;opacity:.8;font-size:13px;margin-left:4px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;margin:12px 0}
.hero{padding:26px 0 8px}
.hero p{color:var(--muted);max-width:52ch}
.cards{display:grid;gap:12px;margin-top:18px}
.tile{display:block;text-align:left;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;cursor:pointer}
.tile:hover{border-color:var(--accent)}
.tile b{font-family:var(--f-head);font-size:19px;display:block}
.tile span{color:var(--muted);font-size:15px;display:block;margin-top:2px}
.tile .bar{height:6px;background:var(--line);border-radius:9px;margin-top:10px;overflow:hidden}
.tile .bar i{display:block;height:100%;background:var(--accent)}
.tile.main{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.tile.main span{color:inherit;opacity:.9}
.kicker{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.sec{margin:16px 0 6px}
.sec h2{margin-bottom:4px}
.instr{color:var(--muted);font-size:15px;margin:0 0 10px}
.marks{font-size:14px;color:var(--muted);font-weight:700}
.q{display:flex;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;margin:10px 0}
.qn{flex:none;width:28px;height:28px;border-radius:50%;background:var(--accent-soft);display:grid;place-items:center;font-size:14px;font-weight:700;font-variant-numeric:tabular-nums}
.qb{flex:1;min-width:0}
.qt{margin:0 0 8px;overflow-wrap:anywhere}
.qt .ins{color:var(--muted);font-size:14px}
input[type=text],textarea,select{width:100%;border:1.5px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 12px;min-height:44px}
textarea{resize:vertical;min-height:78px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.opts{display:grid;gap:8px}
.opt{text-align:left;border:1.5px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 12px;cursor:pointer;min-height:44px}
.opt.good{border-color:var(--good);background:var(--good-bg)}
.opt.bad{border-color:var(--bad);background:var(--bad-bg)}
.fb{margin-top:10px;padding:10px 12px;border-radius:10px;font-size:16px}
.fb.good{background:var(--good-bg);color:var(--ink);border-left:5px solid var(--good)}
.fb.bad{background:var(--bad-bg);border-left:5px solid var(--bad)}
.fb.part{background:var(--warn-bg);border-left:5px solid var(--warn)}
.fb b.t{display:block;margin-bottom:2px}
.model{margin-top:8px;padding:10px 12px;border:1.5px dashed var(--line);border-radius:10px;background:var(--bg);font-size:16px}
.model .l{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700;display:block;margin-bottom:2px}
.tag{display:inline-block;border-radius:99px;padding:1px 9px;font-size:13px;margin:2px 4px 2px 0}
.tag.h{background:var(--good-bg);color:var(--good)}.tag.m{background:var(--warn-bg);color:var(--warn)}
.passage{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;margin:10px 0;font-size:17px}
.passage b{background:var(--hl);padding:0 3px;border-radius:3px}
.bank{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0;padding:10px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface)}
.bank span{background:var(--accent-soft);border-radius:8px;padding:3px 10px;font-size:15px}
.dlg p{margin:0 0 .5em}
.nav{display:flex;justify-content:space-between;gap:10px;margin:18px 0}
.wc{font-size:14px;color:var(--muted);margin-top:4px;font-variant-numeric:tabular-nums}
.wc.over{color:var(--bad);font-weight:700}
.chk{display:grid;gap:8px;margin:10px 0}
.chk label{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.chk input{margin-top:5px;width:20px;height:20px;flex:none}
.chk .auto{font-weight:700}
.res table,.tbl{width:100%;border-collapse:collapse;font-size:15px}
.tbl th,.tbl td{border-bottom:1px solid var(--line);padding:8px 6px;text-align:left;vertical-align:top}
.tbl th{font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.tw{overflow-x:auto}
.pbar{height:8px;background:var(--line);border-radius:9px;overflow:hidden;min-width:80px}.pbar i{display:block;height:100%;background:var(--accent)}
.g h2{margin:24px 0 8px}.g h3{margin:18px 0 6px}
.g ul,.g ol{padding-left:22px;margin:0 0 .9em}.g li{margin:3px 0}
.tip,.warn,.ex{border-radius:12px;padding:12px 14px;margin:12px 0;font-size:16px}
.tip{background:var(--accent-soft);border-left:5px solid var(--accent)}
.warn{background:var(--warn-bg);border-left:5px solid var(--warn)}
.ex{background:var(--surface);border:1px solid var(--line)}
.ex .l,.tip .l,.warn .l{font-size:12px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;display:block;margin-bottom:3px;color:var(--muted)}
details.acc{background:var(--surface);border:1px solid var(--line);border-radius:12px;margin:10px 0}
details.acc>summary{cursor:pointer;padding:12px 14px;font-weight:700;list-style:none;min-height:44px}
details.acc>summary::after{content:"+";float:right;font-weight:400;font-size:20px;line-height:1}
details.acc[open]>summary::after{content:"–"}
details.acc>.in{padding:0 14px 12px}
.deck{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;margin:12px 0}
.fc{min-height:150px;border:2px solid var(--accent);border-radius:14px;padding:18px;display:grid;place-items:center;text-align:center;cursor:pointer;background:var(--accent-soft);width:100%}
.fc .w{font-family:var(--f-head);font-size:26px;font-weight:700}
.fc .m{font-size:18px}
.fc small{display:block;color:var(--muted);margin-top:6px}
code,.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.92em;background:var(--accent-soft);padding:1px 6px;border-radius:5px}
@media (prefers-reduced-motion:no-preference){.fb,.model{animation:pop .18s ease-out}@keyframes pop{from{opacity:0;transform:translateY(-3px)}}}

/* Burmese: taller lines and a Myanmar-capable font stack */
:lang(my),.mynote,.gl{font-family:'Noto Sans Myanmar','Myanmar Text','Padauk','Pyidaungsu','Atkinson Hyperlegible',system-ui,sans-serif}
html[lang=my] body{line-height:1.9}
html[lang=my] h1,html[lang=my] h2,html[lang=my] h3,html[lang=my] .brand,html[lang=my] .tile b{font-family:'Noto Sans Myanmar','Myanmar Text','Padauk','Pyidaungsu',system-ui,sans-serif;line-height:1.6}
html[lang=my] h1{font-size:26px}html[lang=my] h2{font-size:20px}
.mynote{background:var(--accent-soft);border-color:transparent;margin:10px 0}
.langbtn{flex:none;font-weight:700;border-color:var(--accent);color:var(--accent)}
.gl{margin-top:8px;font-size:20px;font-weight:700;color:var(--accent)}
.my-only{display:block}
</style>
<div id="app"></div><script>
/* ===== helpers & data constructors ===== */
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const norm=s=>String(s).toLowerCase().replace(/[’‘`]/g,"'").replace(/[“”]/g,'"').replace(/[^a-z0-9'%\s-]/g,' ').replace(/\s+/g,' ').trim();
const F=(q,a,why)=>({k:'fill',q,a:[].concat(a),pts:1,why});
const M=(q,o,a,why)=>({k:'mcq',q,o,a,pts:1,why});
const R=(q,m,kw,need,pts,acc,rows)=>({k:'free',q,m,kw:kw||[],need:need||(kw||[]).length||1,pts:pts||1,acc:acc||[],rows:rows||2});
const D=(q,a)=>({k:'sel',q,a,pts:1});
const P=(id,title,groups,tip)=>({id,title,groups,tip});
const G=(sub,instr,items,o)=>Object.assign({sub,instr,items},o||{});
const W=(id,title,marks,limit,kind,instr,options,tip)=>({id,title,write:true,marks,limit,kind,instr,options,tip});

/* ===== persistent state ===== */
const KEY='matric-english-v1';
let S={it:{},w:{},cur:{},fc:{},lang:'en'};
try{const raw=localStorage.getItem(KEY);if(raw){const o=JSON.parse(raw);if(o&&typeof o==='object')S=Object.assign(S,o)}}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};

/* ===== registry ===== */
const ITEM={};            // key -> item
const PAPERS=[];          // filled by paper files
let GUIDE_TRY=0;
function registerPaper(p){
  PAPERS.push(p);
  p.parts.forEach(pt=>{
    if(pt.write){pt.max=pt.marks;pt.options.forEach(o=>o._k=`${p.id}.${pt.id}`);return}
    let max=0;
    pt.groups.forEach((g,gi)=>{
      let n=g.start||1;
      g.items.forEach((it,ii)=>{it._key=`${p.id}.${pt.id}.${gi}.${ii}`;it._n=n++;it._bank=g.bank;ITEM[it._key]=it;max+=it.pts});
    });
    pt.max=max;
  });
  p.max=p.parts.reduce((s,x)=>s+x.max,0);
}

/* ===== grading ===== */
function gradeFree(it,v){
  const n=norm(v);
  if(it.acc.some(a=>norm(a)===n))return{r:1,hit:[],miss:[],exact:true};
  const hit=[],miss=[];
  it.kw.forEach(g=>{const alts=[].concat(g);(alts.some(a=>n.includes(norm(a)))?hit:miss).push(alts[0])});
  const r=it.kw.length?Math.min(1,hit.length/it.need):0;
  return{r,hit,miss};
}
function award(it,r){return Math.floor(r*it.pts+1e-6)}
function pts(key){const s=S.it[key];return s&&s.done?s.pts:0}
function partScore(p,pt){
  if(pt.write){const w=S.w[`${p.id}.${pt.id}`];return{got:w&&w.checked?w.pts:0,done:w&&w.checked?pt.max:0,max:pt.max}}
  let got=0,done=0;
  pt.groups.forEach(g=>g.items.forEach(it=>{const s=S.it[it._key];if(s&&s.done){got+=s.pts;done+=it.pts}}));
  return{got,done,max:pt.max};
}
function paperScore(p){let got=0,done=0;p.parts.forEach(pt=>{const s=partScore(p,pt);got+=s.got;done+=s.done});return{got,done,max:p.max}}
const fmt=n=>Number.isInteger(n)?String(n):n.toFixed(1);

/* ===== item rendering ===== */
function nbr(it){return `<div class="qn">${it._n===undefined?'✎':it._n}</div>`}
function modelBox(it){return it.m?`<div class="model"><span class="l">${t('modelL')}</span>${it.m}</div>`:''}
function whyBox(it){return it.why?`<div class="model"><span class="l">${t('whyL')}</span>${it.why}</div>`:''}
function renderItem(key){
  const it=ITEM[key],st=S.it[key]||{};
  let body='';
  const qt=`<p class="qt">${it.q}</p>`;
  if(it.k==='mcq'){
    body=qt+`<div class="opts">`+it.o.map((o,i)=>{
      let c='opt';if(st.done){if(i===it.a)c+=' good';else if(i===st.v)c+=' bad'}
      return `<button class="${c}" data-act="mcq" data-key="${key}" data-i="${i}" ${st.done?'disabled':''}>${String.fromCharCode(65+i)}. ${o}</button>`}).join('')+`</div>`;
    if(st.done)body+=`<div class="fb ${st.pts?'good':'bad'}"><b class="t">${st.pts?t('correct'):t('notQuite',String.fromCharCode(65+it.a),it.o[it.a])}</b></div>`+whyBox(it);
  }else if(it.k==='sel'){
    const bank=it._bank||[];
    body=qt+`<select data-act="sel" data-key="${key}" ${st.done?'disabled':''} aria-label="${t('chooseAria')}"><option value="">${t('choose')}</option>${bank.map(b=>`<option ${st.done&&st.v===b?'selected':''} value="${esc(b)}">${esc(b)}</option>`).join('')}</select>`;
    if(st.done)body+=`<div class="fb ${st.pts?'good':'bad'}"><b class="t">${st.pts?t('correct'):t('ansIs')+esc(it.a)}</b></div>`;
  }else if(it.k==='fill'){
    body=qt;
    if(st.done){
      body+=`<input type="text" value="${esc(st.v||'')}" disabled>`;
      body+=`<div class="fb ${st.pts?'good':'bad'}"><b class="t">${st.pts?t('correct'):t('ansIs')+it.a.map(esc).join(' / ')}</b></div>`+whyBox(it);
    }else{
      body+=`<input type="text" data-in="${key}" placeholder="${t('typePh')}" autocomplete="off" autocapitalize="off" spellcheck="false"><div class="row"><button class="btn pri sm" data-act="chk" data-key="${key}">${t('check')}</button><button class="btn sm" data-act="rev" data-key="${key}">${t('show')}</button></div>`;
    }
  }else{ // free
    body=qt;
    if(st.done){
      body+=`<textarea rows="${it.rows}" disabled>${esc(st.v||'')}</textarea>`;
      const full=st.pts>=it.pts;
      let cls=full?'good':(st.pts>0?'part':'bad');
      let head=st.rev?t('revealed'):full?t('full',st.pts):st.pts>0?t('partly',st.pts,it.pts):t('notYet');
      let det='';
      if(!st.rev&&st.fb){
        if(st.fb.hit.length)det+='<div>'+st.fb.hit.map(h=>`<span class="tag h">✓ ${esc(h)}</span>`).join('')+'</div>';
        if(st.fb.miss.length&&!full)det+='<div>'+st.fb.miss.map(h=>`<span class="tag m">${t('missing')}${esc(h)}</span>`).join('')+'</div>';
      }
      body+=`<div class="fb ${cls}"><b class="t">${head}</b>${det}</div>`+modelBox(it);
      if(!full&&!st.over)body+=`<div class="row"><button class="btn sm" data-act="over" data-key="${key}">${t('over')}</button></div>`;
    }else{
      body+=`<textarea data-in="${key}" rows="${it.rows}" placeholder="${t('writePh')}" spellcheck="false"></textarea><div class="row"><button class="btn pri sm" data-act="chk" data-key="${key}">${t('check')}</button><button class="btn sm" data-act="rev" data-key="${key}">${t('show')}</button></div>`;
    }
  }
  return `<div class="q" data-item="${key}">${nbr(it)}<div class="qb">${body}</div></div>`;
}
function setItem(key,o){S.it[key]=Object.assign({},S.it[key],o,{done:true});save();const el=document.querySelector(`[data-item="${key}"]`);if(el)el.outerHTML=renderItem(key);refreshHead()}
function doCheck(key){
  const it=ITEM[key],inp=document.querySelector(`[data-in="${key}"]`);if(!inp)return;
  const v=inp.value;if(!v.trim()){inp.focus();return}
  if(it.k==='fill'){const ok=it.a.some(a=>norm(a)===norm(v));setItem(key,{v,pts:ok?1:0})}
  else{const g=gradeFree(it,v);setItem(key,{v,pts:award(it,g.r),fb:{hit:g.hit,miss:g.miss}})}
}

/* ===== writing parts ===== */
const LINK=/\b(firstly|secondly|thirdly|finally|moreover|furthermore|in addition|however|therefore|as a result|for example|for instance|on the other hand|in conclusion|to sum up|besides|also|because|although)\b/gi;
function words(t){return(t.trim().match(/\S+/g)||[]).length}
function autoChecks(pt,o,text){
  const n=words(text),list=[];
  if(pt.kind==='letter'){
    list.push({t:t('lenLetter',120,pt.limit,n),ok:n>=120&&n<=pt.limit});
    list.push({t:t('addr'),ok:/\bno\.?\s*\(?\d+/i.test(text)});
    list.push({t:t('salut'),ok:/\bdear\b/i.test(text)});
    list.push({t:t('closing'),ok:/(yours\s+\w+|your\s+(loving\s+)?\w+,|with love|love,|best wishes|regards)/i.test(text)});
    list.push({t:t('polite'),ok:/(how are you|hope (you|this)|thank you for|thanks for|glad to)/i.test(text)});
  }else{
    list.push({t:t('lenLetter',200,pt.limit,n),ok:n>=200&&n<=pt.limit});
    list.push({t:t('paras'),ok:text.split(/\n+/).filter(x=>x.trim()).length>=4});
    const ls=new Set((text.match(LINK)||[]).map(x=>x.toLowerCase()));
    list.push({t:t('links',ls.size),ok:ls.size>=4});
    list.push({t:t('concl'),ok:/(in conclusion|to conclude|to sum up|in short|all in all)/i.test(text)});
    list.push({t:t('formal'),ok:!/\b\w+n['’]t\b|\b(it|that|there|he|she|i|we|they)['’](s|m|re|ve|ll|d)\b/i.test(text)});
  }
  return list;
}
function writeState(key,pt){return S.w[key]||(S.w[key]={opt:0,text:'',checked:false,ticks:[],pts:0})}
function writePoints(pt,o,w){
  const auto=autoChecks(pt,o,w.text),manual=o.chk;
  const total=auto.length+manual.length;
  const ok=auto.filter(a=>a.ok).length+manual.filter((_,i)=>w.ticks[i]).length;
  return Math.round(ok/total*pt.max*2)/2;
}
function renderWrite(p,pt){
  const key=`${p.id}.${pt.id}`,w=writeState(key,pt),o=pt.options[w.opt];
  let h=`<div class="sec"><h2>${pt.title}</h2><p class="instr">${pt.instr} <span class="marks">${t('marksW',pt.max)}</span></p></div>`;
  h+=myNote(pt.id);
  h+=`<div class="chips">`+pt.options.map((x,i)=>`<button class="chip" aria-pressed="${i===w.opt}" data-act="wopt" data-key="${key}" data-i="${i}" ${w.checked&&i!==w.opt?'disabled':''}>${t('optN',i+1)}</button>`).join('')+`</div>`;
  h+=`<div class="card"><b>${o.title}</b><p style="margin:6px 0 0">${o.prompt}</p>${isMy()&&o.my?`<p class="mynote" lang="my">${o.my}</p>`:''}</div>`;
  h+=`<textarea id="wt" data-w="${key}" rows="14" placeholder="${t('planPh')}">${esc(w.text)}</textarea>`;
  const n=words(w.text);
  h+=`<div class="wc ${n>pt.limit?'over':''}" id="wc">${n} / ${pt.limit} ${isMy()?t('words'):'words'}</div>`;
  h+=`<div class="row"><button class="btn pri" data-act="wchk" data-key="${key}">${w.checked?t('recheck'):t('checkW')}</button></div>`;
  if(w.checked){
    const auto=autoChecks(pt,o,w.text);
    h+=`<div class="card"><h3>${t('selfCheck')} <span class="score" id="wsc">${fmt(w.pts)} / ${pt.max}</span></h3><p class="instr">${t('selfNote')}</p><div class="chk">`;
    auto.forEach(a=>h+=`<label><span class="auto">${a.ok?'✓':'✗'}</span><span>${a.t}</span></label>`);
    o.chk.forEach((x,i)=>h+=`<label><input type="checkbox" data-act="tick" data-key="${key}" data-i="${i}" ${w.ticks[i]?'checked':''}><span>${x}</span></label>`);
    h+=`</div></div><details class="acc" open><summary>${t('modelCmp')}</summary><div class="in">${o.model}</div></details>`;
    h+=`<div class="warn"><span class="l">${t('howCmpL')}</span>${t('howCmp')}</div>`;
  }
  return h;
}

/* ===== paper view ===== */
function myNote(id){
  if(!isMy()||!PMY[id])return '';
  return `<div class="mynote card" lang="my"><b>${PMY[id].t}</b><p style="margin:6px 0 0">${PMY[id].i}</p></div>`;
}
function partHTML(p,pt){
  if(pt.write)return renderWrite(p,pt);
  let h=`<div class="sec"><h2>${pt.title}</h2></div>`;
  h+=myNote(pt.id);
  if(pt.tip)h+=`<div class="tip"><span class="l">${t('examTip')}</span>${pt.tip}</div>`;
  pt.groups.forEach(g=>{
    if(g.sub)h+=`<h3 style="margin-top:14px">${g.sub} ${g.marks?`<span class="marks">${t('marksW',g.marks)}</span>`:''}</h3>`;
    if(g.instr)h+=`<p class="instr">${g.instr}</p>`;
    if(g.passage)h+=`<div class="passage">${g.passage}</div>`;
    if(g.bank)h+=`<div class="bank">${g.bank.map(b=>`<span>${esc(b)}</span>`).join('')}</div>`;
    if(g.dialogue)h+=`<div class="passage dlg">${g.dialogue}</div>`;
    g.items.forEach(it=>h+=renderItem(it._key));
  });
  return h;
}
function resultsHTML(p){
  const ps=paperScore(p);
  const pct=ps.done?Math.round(ps.got/ps.done*100):0;
  let h=`<div class="sec"><h2>${t('results')}</h2></div><div class="card"><div class="kicker">${t('yourScore')}</div><h1 style="margin:4px 0">${fmt(ps.got)} / ${ps.max}</h1><p style="margin:0;color:var(--muted)">${ps.done<ps.max?t('answered',fmt(ps.done),ps.max,pct):t('finished',pct)}</p></div>`;
  h+=`<div class="card tw"><table class="tbl"><tr><th>${t('colPart')}</th><th>${t('colMarks')}</th><th></th></tr>`;
  const weak=[];
  p.parts.forEach(pt=>{const s=partScore(p,pt);const f=s.done?s.got/s.done:0;
    if(s.done>0&&f<0.6)weak.push(pt);
    h+=`<tr><td>${pt.title.split('.')[0]}${pt.title.includes('.')?'.':''}<br><span class="marks">${pt.title.split('.').slice(1).join('.').trim()}</span></td><td style="white-space:nowrap">${fmt(s.got)} / ${s.max}</td><td style="min-width:90px"><div class="pbar"><i style="width:${s.max?Math.round(s.got/s.max*100):0}%"></i></div></td></tr>`});
  h+=`</table></div>`;
  if(weak.length)h+=`<div class="warn"><span class="l">${t('workOn')}</span>`+weak.map(pt=>`<p style="margin:.3em 0"><b>${pt.title}</b>${isMy()&&PMY[pt.id]?`<br><span lang="my">${PMY[pt.id].i}</span>`:(pt.tip?`<br>${pt.tip}`:'')}</p>`).join('')+`</div>`;
  else if(ps.done>=ps.max*0.5)h+=`<div class="tip"><span class="l">${t('goodWork')}</span>${t('goodWorkTxt')}</div>`;
  h+=`<div class="row"><button class="btn" data-act="reset" data-key="${p.id}">${t('resetBtn')}</button></div>`;
  return h;
}
function paperView(p){
  const cur=Math.min(S.cur[p.id]||0,p.parts.length);
  let h=`<div class="hero" style="padding-top:16px"><div class="kicker">${t('pKicker',p.n)}</div><h2 style="margin-top:4px">${p.title}</h2><p style="margin:6px 0 0;color:var(--muted)">${p.focus}</p></div>`;
  h+=`<div class="chips" id="pchips">`;
  p.parts.forEach((pt,i)=>{const s=partScore(p,pt);h+=`<button class="chip" aria-pressed="${i===cur}" data-act="part" data-i="${i}">${pt.id}${s.done?`<span class="d">${fmt(s.got)}/${s.max}</span>`:''}</button>`});
  h+=`<button class="chip" aria-pressed="${cur===p.parts.length}" data-act="part" data-i="${p.parts.length}">${t('resChip')}</button></div>`;
  h+=`<div id="pbody">`+(cur>=p.parts.length?resultsHTML(p):partHTML(p,p.parts[cur]))+`</div>`;
  h+=`<div class="nav"><button class="btn" data-act="prev" ${cur===0?'disabled':''}>${t('back')}</button><button class="btn pri" data-act="next" ${cur>=p.parts.length?'disabled':''}>${cur===p.parts.length-1?t('seeRes'):t('next')}</button></div>`;
  return h;
}
function refreshHead(){
  const p=currentPaper();if(!p)return;
  const ps=paperScore(p),el=$('#sc');if(el)el.textContent=`${fmt(ps.got)} / ${ps.max}`;
  const ch=$('#pchips');if(ch){const cur=Math.min(S.cur[p.id]||0,p.parts.length);
    ch.querySelectorAll('[data-act=part]').forEach((b,i)=>{if(i>=p.parts.length)return;const s=partScore(p,p.parts[i]);b.innerHTML=`${p.parts[i].id}${s.done?`<span class="d">${fmt(s.got)}/${s.max}</span>`:''}`})}
}
function currentPaper(){const m=/^#paper-(\d)$/.exec(location.hash);return m?PAPERS.find(x=>x.n==m[1]):null}

/* ===== flashcards & guide blocks ===== */
const GLOSS={};
function deckHTML(id){
  const d=DECKS[id],st=S.fc[id]||(S.fc[id]={i:0,f:false,k:{}});
  const known=Object.keys(st.k).length,c=d.cards[st.i%d.cards.length];
  const gl=GLOSS[c[0].toLowerCase()];
  const title=isMy()&&d.my?d.my:d.title;
  return `<div class="deck" data-deck="${id}"><div class="kicker">${t('deckLine',title,st.i%d.cards.length+1,d.cards.length,known)}</div>
  <button class="fc" data-act="flip" data-deck="${id}" aria-label="${t('flip')}">${st.f?`<div><div class="m">${c[1]}</div>${isMy()&&gl?`<div class="gl" lang="my">${gl}</div>`:''}${c[2]?`<small>${t('eg')}${c[2]}</small>`:''}</div>`:`<div><div class="w">${c[0]}</div><small>${t('tapSee')}</small></div>`}</button>
  <div class="row"><button class="btn" data-act="again" data-deck="${id}">${t('again')}</button><button class="btn pri" data-act="got" data-deck="${id}">${t('gotIt')}</button><button class="btn sm" data-act="dreset" data-deck="${id}">${t('resetDeck')}</button></div></div>`;
}
const DECKS={};
function blockHTML(b){
  switch(b[0]){
    case 'h2':return `<h2>${b[1]}</h2>`;
    case 'h3':return `<h3>${b[1]}</h3>`;
    case 'p':return b[1]?`<p>${b[1]}</p>`:'';
    case 'ul':return `<ul>${b[1].map(x=>`<li>${x}</li>`).join('')}</ul>`;
    case 'ol':return `<ol>${b[1].map(x=>`<li>${x}</li>`).join('')}</ol>`;
    case 'tip':return `<div class="tip"><span class="l">${b[2]||'Tip'}</span>${b[1]}</div>`;
    case 'warn':return `<div class="warn"><span class="l">${b[2]||'Watch out'}</span>${b[1]}</div>`;
    case 'ex':return `<div class="ex"><span class="l">${b[2]||'Example'}</span>${b[1]}</div>`;
    case 'table':return `<div class="card tw"><table class="tbl"><tr>${b[1].map(x=>`<th>${x}</th>`).join('')}</tr>${b[2].map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</table></div>`;
    case 'acc':return `<details class="acc"><summary>${b[1]}</summary><div class="in">${b[2].map(blockHTML).join('')}</div></details>`;
    case 'try':{const it=b[1];if(!it._key){it._key='g.'+(GUIDE_TRY++);it._n=undefined;ITEM[it._key]=it;it._bank=it.bank}return renderItem(it._key)}
    case 'deck':return deckHTML(b[1]);
  }
  return '';
}

/* ===== shell ===== */
function homeView(){
  let h=`<div class="hero"><div class="kicker">${t('kHome')}</div><h1 style="margin-top:6px">${t('title')}</h1><p style="margin-top:10px">${t('homeIntro')}</p></div><div class="cards">`;
  h+=`<button class="tile main" data-go="guide"><b>${t('startGuide')}</b><span>${t('startGuideSub')}</span></button>`;
  PAPERS.forEach(p=>{const s=paperScore(p),w=s.max?Math.round(s.done/s.max*100):0;
    h+=`<button class="tile" data-go="paper-${p.n}"><b>${t('paperN',p.n)}</b><span>${p.focus}</span><div class="bar"><i style="width:${w}%"></i></div><span style="font-size:14px">${s.done?t('soFar',fmt(s.got),fmt(s.done)):t('notStarted')}</span></button>`});
  h+=`</div><div class="card" style="margin-top:18px"><b>${t('howTitle')}</b><ul style="margin:6px 0 0;padding-left:20px"><li>${t('how1')}</li><li>${t('how2')}</li><li>${t('how3')}</li><li>${t('how4')}</li><li>${t('how5')}</li></ul></div>`;
  return h;
}
function gview(sec){return isMy()&&sec.my?sec.my:sec}
function guideView(){
  const secs=GUIDE,cur=Math.min(S.cur.guide||0,secs.length-1),v=gview(secs[cur]);
  let h=`<div class="hero" style="padding-top:16px"><div class="kicker">${t('studyGuide')} · ${cur+1}/${secs.length}</div><h2 style="margin-top:4px">${v.title}</h2></div><div class="chips" id="gchips">`+secs.map((s,i)=>`<button class="chip" aria-pressed="${i===cur}" data-act="gsec" data-i="${i}">${gview(s).short}</button>`).join('')+`</div><div class="g" id="gbody">`+v.blocks.map(blockHTML).join('')+`</div>`;
  h+=`<div class="nav"><button class="btn" data-act="gprev" ${cur===0?'disabled':''}>${t('gback')}</button><button class="btn pri" data-act="gnext" ${cur===secs.length-1?'disabled':''}>${t('gnext')}</button></div>`;
  return h;
}
function render(){
  const root=$('#app'),hash=location.hash||'#home';
  document.documentElement.lang=isMy()?'my':'en';
  let body='',title=t('title'),score='';
  if(hash==='#guide'){body=guideView();title=t('studyGuide')}
  else if(/^#paper-\d$/.test(hash)&&currentPaper()){const p=currentPaper();body=paperView(p);title=t('paperN',p.n);score=`<span class="score" id="sc">${fmt(paperScore(p).got)} / ${p.max}</span>`}
  else body=homeView();
  root.innerHTML=`<div class="top"><div class="wrap">${hash==='#home'||!location.hash?'':`<button class="btn sm" data-go="home">${t('home')}</button>`}<div class="brand">${title}</div>${score}<button class="btn sm langbtn" data-act="lang" aria-label="Language">${t('langBtn')}</button></div></div><div class="wrap">${body}</div>`;
}
function go(h){if(location.hash==='#'+h){render()}else location.hash=h;window.scrollTo(0,0)}
window.addEventListener('hashchange',()=>{render();window.scrollTo(0,0)});

/* ===== events ===== */
document.addEventListener('click',e=>{
  const g=e.target.closest('[data-go]');if(g){go(g.dataset.go);return}
  const b=e.target.closest('[data-act]');if(!b)return;
  const a=b.dataset.act,key=b.dataset.key,p=currentPaper();
  if(a==='lang'){S.lang=isMy()?'en':'my';save();const y=window.scrollY;render();window.scrollTo(0,y)}
  else if(a==='mcq'){const it=ITEM[key],i=+b.dataset.i;setItem(key,{v:i,pts:i===it.a?1:0})}
  else if(a==='chk')doCheck(key);
  else if(a==='rev'){setItem(key,{v:'',pts:0,rev:true})}
  else if(a==='over'){const it=ITEM[key];S.it[key].pts=it.pts;S.it[key].over=true;save();const el=document.querySelector(`[data-item="${key}"]`);el.outerHTML=renderItem(key);refreshHead()}
  else if(a==='part'){S.cur[p.id]=+b.dataset.i;save();render();window.scrollTo(0,0)}
  else if(a==='next'||a==='prev'){S.cur[p.id]=Math.max(0,Math.min(p.parts.length,(S.cur[p.id]||0)+(a==='next'?1:-1)));save();render();window.scrollTo(0,0)}
  else if(a==='gsec'){S.cur.guide=+b.dataset.i;save();render();window.scrollTo(0,0)}
  else if(a==='gnext'||a==='gprev'){S.cur.guide=Math.max(0,Math.min(GUIDE.length-1,(S.cur.guide||0)+(a==='gnext'?1:-1)));save();render();window.scrollTo(0,0)}
  else if(a==='wopt'){writeState(key).opt=+b.dataset.i;save();render()}
  else if(a==='wchk'){const w=writeState(key);const pt=p.parts.find(x=>`${p.id}.${x.id}`===key);const ta=$('#wt');w.text=ta.value;if(words(w.text)<10){ta.focus();return}w.checked=true;w.pts=writePoints(pt,pt.options[w.opt],w);save();render();const c=document.querySelector('.chk');if(c)c.scrollIntoView({behavior:'smooth',block:'center'});refreshHead()}
  else if(a==='reset'){if(b.dataset.armed){Object.keys(S.it).forEach(k=>{if(k.startsWith(key+'.'))delete S.it[k]});Object.keys(S.w).forEach(k=>{if(k.startsWith(key+'.'))delete S.w[k]});S.cur[key]=0;save();render()}else{b.dataset.armed=1;b.textContent=t('resetArm')}}
  else if(a==='flip'){const st=S.fc[b.dataset.deck];st.f=!st.f;save();b.closest('.deck').outerHTML=deckHTML(b.dataset.deck)}
  else if(a==='got'||a==='again'){const id=b.dataset.deck,st=S.fc[id],n=DECKS[id].cards.length;if(a==='got')st.k[st.i%n]=1;else delete st.k[st.i%n];st.i=(st.i+1)%n;st.f=false;save();b.closest('.deck').outerHTML=deckHTML(id)}
  else if(a==='dreset'){S.fc[b.dataset.deck]={i:0,f:false,k:{}};save();b.closest('.deck').outerHTML=deckHTML(b.dataset.deck)}
});
document.addEventListener('change',e=>{
  const el=e.target;
  if(el.dataset.act==='sel'){const it=ITEM[el.dataset.key];if(!el.value)return;setItem(el.dataset.key,{v:el.value,pts:norm(el.value)===norm(it.a)?1:0})}
  else if(el.dataset.act==='tick'){const p=currentPaper(),key=el.dataset.key,w=writeState(key),pt=p.parts.find(x=>`${p.id}.${x.id}`===key);w.ticks[+el.dataset.i]=el.checked;w.pts=writePoints(pt,pt.options[w.opt],w);save();const s=$('#wsc');if(s)s.textContent=`${fmt(w.pts)} / ${pt.max}`;refreshHead()}
});
document.addEventListener('input',e=>{
  const el=e.target;
  if(el.dataset.w){const p=currentPaper(),key=el.dataset.w,w=writeState(key),pt=p.parts.find(x=>`${p.id}.${x.id}`===key);w.text=el.value;save();const n=words(el.value),wc=$('#wc');wc.textContent=`${n} / ${pt.limit} ${isMy()?t('words'):'words'}`;wc.classList.toggle('over',n>pt.limit)}
});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.matches('input[data-in]')){e.preventDefault();doCheck(e.target.dataset.in)}});

{title:"Option 1: To a friend about caring for the environment",my:"သင်သည် Su Su ဖြစ်သည်။ ပတ်ဝန်းကျင်ကို ကာကွယ်ရန် သင်ကြိုးစားနေပုံကို သူငယ်ချင်း Hla Hla အား ပြောပြပြီး သူမကိုလည်း လိုက်လုပ်ရန် အားပေးသော စာရေးပါ။",prompt:"You are <b>Su Su</b>. You live at <b>No. 15, Bogyoke Road, Taunggyi</b>. Write a letter to your friend, <b>Hla Hla</b>, telling her how you are trying to protect the environment and encouraging her to do the same.",chk:["Tells at least three things I do to protect the environment","Encourages Hla Hla to do the same","Each paragraph has one main idea","I checked spelling and verb tenses"],
model:"<p>No. 15, Bogyoke Road,<br>Taunggyi.<br>12th October 2026</p><p>Dear Hla Hla,</p><p>How are you? I hope you and your family are well. I am writing to tell you what I have been doing to protect our environment, and to ask you to join me.</p><p>First, I stopped using plastic bags. I carry a cloth bag to the market, and I use a metal bottle instead of buying water in plastic ones. Second, I walk to school, so I use less fuel and add no smoke to the air. Third, I sort my rubbish at home into paper, glass and food waste. At school, our club has planted twenty trees in the playground, and we clean the stream near our school every month.</p><p>These are small steps, but they make a difference. If everyone tried, our towns would be cleaner and healthier. I would be very happy if you started a green habit in your own school. Why not begin by planting a tree this rainy season?</p><p>Please write back and tell me what you decide to do. Give my best wishes to your parents.</p><p>Yours sincerely,<br>Su Su</p>"},
{title:"Option 2: To an uncle, saying sorry",my:"သင်သည် Kyaw Min ဖြစ်သည်။ ရန်ကုန်တွင်နေသော ဦးလေးအား သူ၏ အိမ်သစ်ဝင်ပွဲကို မတက်နိုင်ခဲ့သည့်အတွက် တောင်းပန်ပြီး အကြောင်းရင်းကို ရှင်းပြသော စာရေးပါ။",prompt:"You are <b>Kyaw Min</b>. You live at <b>No. 3, Station Road, Pathein</b>. Write a letter to your uncle, who lives in Yangon, saying sorry for not attending his house-warming party last Sunday and explaining why you could not come.",chk:["Says sorry clearly","Gives a believable reason","Promises to make up for it (a visit or a gift)","Each paragraph has one main idea"],
model:"<p>No. 3, Station Road,<br>Pathein.<br>12th October 2026</p><p>Dear Uncle,</p><p>How are you? I hope you, Aunt and the children are well. I am writing to say sorry. I could not come to your house-warming party last Sunday.</p><p>I wanted very much to be there. Unfortunately, heavy rain flooded the road to the bus station, and no buses left Pathein that day. I waited for three hours, but in the end I had to go home. I felt very sad because I know the party was a special day for your family.</p><p>Please forgive me. I will come to Yangon in the school holiday, and I will bring a small gift for your new home. Then you can show me every room.</p><p>Please give my love to Aunt and the children.</p><p>Yours lovingly,<br>Kyaw Min</p>"}
],"Letters: address, date, salutation, 3 short paragraphs, closing, name. Cover every point in the prompt."),
W('IX','IX. Essay',15,500,'essay',"Write an essay on ONE of the following. Do not write more than 500 words.",[
{title:"Option 1: The causes and effects of pollution",my:"ညစ်ညမ်းမှု၏ အကြောင်းရင်းများနှင့် အကျိုးဆက်များ အကြောင်း ဆောင်းပါးရေးပါ။",prompt:"Write an essay on <b>The causes and effects of pollution</b>.",chk:ECHK,model:"<p>Pollution is one of the greatest threats to our planet today. It means adding harmful substances to the air, water and soil. In this essay, I will discuss its main causes and its effects.</p><p>The first cause is the burning of fossil fuels. Cars, factories and power stations release smoke and gases into the air. Secondly, industries and farms pollute water and soil with chemical wastes, fertilisers and pesticides. In addition, people throw away plastic and electronic waste carelessly, and it does not break down for many years.</p><p>These causes lead to serious effects. Polluted air results in asthma, eye irritation and even lung cancer, and the extra greenhouse gases make the earth warmer. Polluted water spreads diseases such as cholera and diarrhoea, and it kills fish and other aquatic life. Moreover, noise and light pollution harm our sleep and our mental health.</p><p>However, we can reduce pollution. Governments should make stricter laws for factories, and everyone should use public transport, plant trees and recycle waste. We should also use renewable energy such as the sun and the wind.</p><p>In conclusion, pollution is caused mainly by human activities, so only human action can stop it. If we act now, we can protect our health and leave a clean earth for the next generation.</p>"},
{title:"Option 2: Good manners make a good citizen",my:"ကောင်းမွန်သော ကျင့်ဝတ်သည် ကောင်းမွန်သော နိုင်ငံသားကို ဖန်တီးသည် − ဆောင်းပါးရေးပါ။",prompt:"Write an essay on <b>Good manners make a good citizen</b>.",chk:ECHK,model:"<p>Manners are the way a person behaves in society. A person who has good manners is respected everywhere, and such a person becomes a good citizen. In my view, good manners are the foundation of a peaceful society.</p><p>Firstly, good manners create a pleasant atmosphere at home and at school. When we greet people politely, say “thank you” and “sorry”, and show respect to our elders, others feel comfortable and happy.</p><p>Secondly, good manners help us to get on well in life. An employee who is punctual, honest and helpful is trusted by the employer and is likely to be promoted. In our culture, for example, a junior waits for a senior to start eating, which shows respect.</p><p>Thirdly, good manners are learnt from role models. Children imitate their parents and teachers, so the elders must set a good example. Teenagers can also be misled by celebrities, films and the internet, so they should choose their role models carefully.</p><p>Some people believe that talent matters more than manners. However, a talented person who is rude will lose friends and opportunities.</p><p>To sum up, good manners make our life smooth and our society strong. Therefore, everyone should practise them every day.</p>"},
{title:"Option 3: Why we should use renewable energy",my:"ပြန်လည်ပြည့်ဖြိုးသော စွမ်းအင်ကို ဘာကြောင့် သုံးသင့်သလဲ − ဆောင်းပါးရေးပါ။",prompt:"Write an essay on <b>Why we should use renewable energy</b>.",chk:ECHK,model:"<p>Our world depends on energy for homes, factories, transport and schools. At present, most of this energy comes from coal, oil and gas, but these fuels are running out and they damage the environment. For these reasons, we should use renewable energy.</p><p>First, renewable energy is inexhaustible. The sun will shine and the wind will blow as long as the earth exists, whereas fossil fuels take millions of years to form.</p><p>Second, it is clean. Solar panels, wind turbines and hydropower plants produce electricity without releasing carbon dioxide, so they do not cause air pollution or global warming.</p><p>Third, it can reduce costs in the long run. Wind power is now one of the cheapest forms of energy, and solar panels are especially useful in remote villages that have no electricity grid.</p><p>Some people argue that renewable energy has drawbacks. For example, hydropower dams may flood land, and solar and wind power depend on the weather. Nevertheless, these problems are small compared with the harm caused by burning fossil fuels, and technology is improving all the time.</p><p>In conclusion, renewable energy is the best choice for our future. Governments and citizens should work together to adopt it before it is too late.</p>"}
],"Essay: introduction, 3 body paragraphs with examples, conclusion. 300 to 400 words is a safe target. Use linking words.")
]});

{title:"Option 1: To a friend about stress",my:"သင်သည် Nanda ဖြစ်သည်။ စာမေးပွဲကာလ စိတ်ဖိစီးမှုက သင့်ကို မည်သို့ ထိခိုက်နေသည်ကို သူငယ်ချင်း Thiri အား ပြောပြပြီး အကြံတောင်းသော စာရေးပါ။",prompt:"You are <b>Nanda</b>. You live at <b>No. 8, Lanmadaw Road, Mandalay</b>. Write a letter to your friend, <b>Thiri</b>, telling her how stress is affecting you during exam time and asking for advice.",chk:["Explains what makes me stressed and how it affects me","Asks for advice clearly","Each paragraph has one main idea","I checked spelling and verb tenses"],
model:"<p>No. 8, Lanmadaw Road,<br>Mandalay.<br>20th October 2026</p><p>Dear Thiri,</p><p>How are you? I hope you are well and enjoying your studies. I am writing because I need some advice from you.</p><p>The exams are coming soon, and I feel very stressed. My parents expect me to get good marks in every subject, so I study late every night. As a result, I often have headaches and I cannot sleep well. I also feel lonely because I have no time to see my friends. Sometimes I cannot concentrate, and I worry that I will fail.</p><p>I have tried to relax by listening to music, but it does not help much. You always seem calm, so I would like to know what you do. Do you take breaks? Do you exercise? Please tell me how you plan your study time and how you cope with stress.</p><p>I would be very grateful for your advice. Please write back soon and give my regards to your family.</p><p>With love,<br>Nanda</p>"},
{title:"Option 2: To a friend, recommending a book",my:"သင်သည် Aung Aung ဖြစ်သည်။ မကြာသေးမီက ဖတ်ခဲ့သော စာအုပ်တစ်အုပ်ကို သူငယ်ချင်း Kyaw Zin အား အကြံပြုပြီး ဘာကြောင့် ဖတ်သင့်သည်ကို ပြောပြသော စာရေးပါ။",prompt:"You are <b>Aung Aung</b>. You live at <b>No. 21, Bogyoke Street, Sagaing</b>. Write a letter to your friend, <b>Kyaw Zin</b>, recommending a book you have recently read and telling him why he should read it.",chk:["Gives the name of the book and what it is about","Gives at least two reasons to read it","Asks him to read it and to write back","Each paragraph has one main idea"],
model:"<p>No. 21, Bogyoke Street,<br>Sagaing.<br>12th October 2026</p><p>Dear Kyaw Zin,</p><p>How are you? I hope you are well and enjoying your studies. I am writing to recommend a book that I have just finished. It is called <i>The Last Leaf</i>, a short story by O. Henry.</p><p>The story is about two young artists, Sue and Johnsy. Johnsy is very ill, and she believes that she will die when the last leaf falls from the tree outside her window. An old neighbour does something very kind to give her hope. I will not tell you the end, because I want you to enjoy it.</p><p>I think you should read it for two reasons. First, it is short and the English is easy to follow, so it will also help your vocabulary. Second, it teaches us about friendship and sacrifice. I kept thinking about it for days.</p><p>Please read it and tell me what you think.</p><p>Your friend,<br>Aung Aung</p>"}
],"Letters: address, date, salutation, 3 short paragraphs, closing, name."),
W('IX','IX. Essay',15,500,'essay',"Write an essay on ONE of the following. Do not write more than 500 words.",[
{title:"Option 1: The impact of artificial intelligence on our lives",my:"ကျွန်ုပ်တို့ဘဝအပေါ် AI ၏ သက်ရောက်မှု − ဆောင်းပါးရေးပါ။",prompt:"Write an essay on <b>The impact of artificial intelligence on our lives</b>.",chk:ECHK,model:"<p>Artificial Intelligence, or AI, is the science of making machines that can think and act like humans. It is now part of our daily life, and its impact is both positive and negative.</p><p>Firstly, AI makes our life easier. When we type a message, the computer suggests words and corrects our spelling. Google Maps and GPS apps help us to reach unfamiliar places. In hospitals, robots deliver food and medicine to patients, and in education, AI helps teachers to grade tests.</p><p>Secondly, AI makes work safer and faster. Self-driving cars can reduce driver error and accidents, and AI-powered robots in factories can produce goods in less time. Robotic boats are even used to clean lakes, rivers and seas.</p><p>However, AI also has drawbacks. When machines do the work of human workers, many people may lose their jobs. In addition, if powerful AI tools fall into the hands of bad people, they can cause great harm.</p><p>In my opinion, the benefits of AI outweigh its risks if we control it wisely. Governments should make clear rules, and people should keep learning new skills.</p><p>In conclusion, AI is a powerful tool. Whether it helps or harms us depends on how we use it.</p>"},
{title:"Option 2: How to deal with stress",my:"စိတ်ဖိစီးမှုကို ဘယ်လို ကိုင်တွယ်မလဲ − ဆောင်းပါးရေးပါ။",prompt:"Write an essay on <b>How to deal with stress</b>.",chk:ECHK,model:"<p>Stress is a normal reaction to pressure, and almost everyone suffers from it at some time. Students feel it before exams, and workers feel it when deadlines are near. If it continues for a long time, it can harm both the body and the mind, so we should know how to deal with it.</p><p>Stress affects our health in many ways. We may have headaches, we may not sleep well, and we may feel tired and worried all the time. Some people put on or lose weight, and others find it hard to concentrate.</p><p>Fortunately, there are several ways to reduce stress. First, we should exercise regularly, at least three times a week, because physical activity produces chemicals in the brain that make us feel happier. Second, we can practise mindfulness, which means paying attention to the present moment. Third, laughter and time with friends and family can lift our mood.</p><p>We should also plan our time well. A student who studies a little every day will feel less pressure than one who studies only at the last minute. Keeping a diary of our feelings can help us understand what worries us.</p><p>In conclusion, stress cannot be avoided completely, but it can be managed. If we take care of our body and mind, we will cope with life’s challenges more easily.</p>"},
{title:"Option 3: Why colours matter in our life",my:"အရောင်များသည် ကျွန်ုပ်တို့ဘဝတွင် ဘာကြောင့် အရေးကြီးသလဲ − ဆောင်းပါးရေးပါ။",prompt:"Write an essay on <b>Why colours matter in our life</b>.",chk:ECHK,model:"<p>We live in a world of colour from our earliest days. Colours do not only make things beautiful. They also carry meanings, and they are an important part of our language and our culture.</p><p>Firstly, colours are used to send messages quickly. The traffic lights, for example, use red for stop, amber for slow down and green for go. Companies choose the colour of their brand carefully. A bank uses a calm blue to show that it is trustworthy, and advertisers use bright, cheerful colours to suggest a happier future.</p><p>Secondly, colours show identity. We wear uniforms at school or in the army to show that we belong to a group, and football fans wear the colours of their team. The colours of a national flag represent the history, beliefs and values of a country.</p><p>Thirdly, English is full of colour idioms. When people feel sad, they feel blue. A person who is in the pink is in good health, and a company that is in the red is losing money. Learning these idioms improves our English.</p><p>Colours can also influence our feelings. Red can stimulate us, while grey can make us feel passive.</p><p>In conclusion, colours matter because they communicate, identify and influence us. Without them, our life would be dull.</p>"}
],"Essay: introduction, 3 body paragraphs with examples, conclusion. 300 to 400 words is a safe target.")
]});

{title:"Option 1: To an uncle, saying thank you for a gift",my:"သင်သည် Phyu Phyu ဖြစ်သည်။ စင်္ကာပူတွင်နေသော ဦးလေးထံမှ ရရှိသော အင်္ဂလိပ်အဘိဓာန်အတွက် ကျေးဇူးတင်ပြီး ၎င်းက သင့်ကို မည်သို့ အကူအညီပေးသည်ကို ပြောပြသော စာရေးပါ။",prompt:"You are <b>Phyu Phyu</b>. You live at <b>No. 5, Pagoda Road, Monywa</b>. Write a letter to your uncle, who lives in Singapore, thanking him for the English dictionary he sent you and telling him how it helps you.",chk:["Thanks him clearly for the gift","Explains at least two ways the gift is useful","Gives him some news about my studies","Each paragraph has one main idea"],
model:"<p>No. 5, Pagoda Road,<br>Monywa.<br>12th October 2026</p><p>Dear Uncle,</p><p>How are you? I hope you and Aunt are well in Singapore. I am writing to thank you for the English dictionary. It arrived yesterday, and I am very happy with it.</p><p>It was so kind of you. The dictionary is very useful for my studies. When I read a new word in my textbook, I can find its meaning and an example sentence at once. It also shows me how to say the word, so my speaking is getting better. I use it every evening when I do my homework and write my essays.</p><p>At school I am working hard for the Matriculation Examination. My English is improving, and my teacher says my writing is much clearer now.</p><p>Thank you again. Please give my love to Aunt.</p><p>Yours lovingly,<br>Phyu Phyu</p>"},
{title:"Option 2: To a cousin about a festival",my:"သင်သည် Zaw Zaw ဖြစ်သည်။ မကြာသေးမီက ပျော်ခဲ့သော ရိုးရာပွဲတော်အကြောင်း ဝမ်းကွဲ Min Min အား ပြောပြပြီး ဖိတ်ခေါ်သော စာရေးပါ။",prompt:"You are <b>Zaw Zaw</b>. You live at <b>No. 27, Lake Road, Kalaw</b>. Write a letter to your cousin, <b>Min Min</b>, telling him about a traditional festival you enjoyed recently and inviting him to join you next year.",chk:["Describes the festival and what I did there","Invites my cousin to join next year","Each paragraph has one main idea","I checked spelling and verb tenses"],
model:"<p>No. 27, Lake Road,<br>Kalaw.<br>25th October 2026</p><p>Dear Min Min,</p><p>How are you? I hope you and your parents are well. I am writing to tell you about the Tazaungdaing festival that I enjoyed last month.</p><p>It is held on the full moon day of Tazaungmon. On that night, people in our town released fire balloons into the sky. Some balloons were shaped like animals, and they glowed beautifully in the dark. We also offered new robes to the monks and shared sweet rice with our neighbours. My friends and I stayed up late, listened to music and took many photographs.</p><p>I enjoyed it very much because everyone was happy and friendly. It also reminded me how important our traditions are.</p><p>Why don’t you come and stay with us next year? I am sure you will love it. Please write soon and let me know.</p><p>Yours lovingly,<br>Zaw Zaw</p>"}
],"Letters: address, date, salutation, 3 short paragraphs, closing, name."),
W('IX','IX. Essay',15,500,'essay',"Write an essay on ONE of the following. Do not write more than 500 words.",[
{title:"Option 1: The importance of communication skills",my:"ဆက်သွယ်ရေးကျွမ်းကျင်မှု၏ အရေးပါပုံ − ဆောင်းပါးရေးပါ။",prompt:"Write an essay on <b>The importance of communication skills</b>.",chk:ECHK,model:"<p>Communication skills are the abilities to share our ideas, feelings and knowledge clearly in speech or in writing. In the twenty-first century, they are regarded as a vital life skill. In my opinion, everyone should work to improve them.</p><p>Firstly, good communication helps us to succeed in our careers. Employers look for people who can explain their ideas, listen carefully and work with others. In Myanmar, the growth of business, tourism and contact with foreigners means that people who can speak English well are in great demand.</p><p>Secondly, communication builds good relationships. When we listen politely, use a suitable tone of voice and respect other people’s turn to talk, we avoid misunderstandings. In contrast, poor communication at home or at school can cause quarrels.</p><p>Thirdly, communication skills can be developed. The home is the best place to begin, because children learn vocabulary and polite language from their parents. Schools can also help by giving students many chances to speak, present and write.</p><p>Some people think that communication is a natural gift. However, even shy students can improve by practising every day.</p><p>In conclusion, communication skills open the door to success and friendship. Therefore, we should practise them whenever we can.</p>"},
{title:"Option 2: The most enjoyable festival in Myanmar",my:"မြန်မာနိုင်ငံ၏ အပျော်ရွှင်ဆုံး ပွဲတော် − ဆောင်းပါးရေးပါ။",prompt:"Write an essay on <b>The most enjoyable festival in Myanmar</b>.",chk:ECHK,model:"<p>Myanmar is a land of festivals, and nearly every month has one. Among them all, I think Thingyan, the Water Festival, is the most enjoyable. It is celebrated in April to welcome the Myanmar New Year.</p><p>Firstly, Thingyan is full of fun. For three or four days, people throw water at each other from pandals and trucks. Nobody should be angry, because the water is meant to wash away bad luck and sins of the old year. Young and old, rich and poor, all join in the play.</p><p>Secondly, it is a time for family and kindness. Many people return to their home towns to meet their relatives. They also keep the precepts, offer food to monks, and pour water on the hands of their elders to show respect.</p><p>Thirdly, Thingyan shows our culture. We can enjoy traditional songs, dances and special food such as mont lone yay baw. Tourists who visit during this time often say that they will never forget it.</p><p>Of course, some people complain about the noise or the traffic. However, these problems are small compared with the joy the festival brings.</p><p>To sum up, Thingyan is the most enjoyable festival because it brings fun, family and culture together.</p>"},
{title:"Option 3: How disabled people can be successful",my:"မသန်စွမ်းသူများ ဘဝတွင် အောင်မြင်နိုင်ပုံ − ဆောင်းပါးရေးပါ။",prompt:"Write an essay on <b>How disabled people can be successful in life</b>.",chk:ECHK,model:"<p>Many people think that a disability must stop a person from living a successful life. The stories of Helen Keller and many others prove that this is not true. With the right attitude and support, disabled people can achieve great things.</p><p>Firstly, a positive attitude is the key. Helen Keller was blind and deaf, yet she never gave up. She learnt to read, write and speak, and she graduated from college. Her determination turned a dark and silent world into one full of knowledge.</p><p>Secondly, good teachers and loving families make a great difference. Annie Sullivan taught Helen language by spelling words into her hand, and she was patient even when Helen was violent. Without such support, Helen might never have learnt to communicate.</p><p>Thirdly, society should give disabled people equal chances. Schools should provide special teaching, and employers should offer jobs to people who have the skills. Modern technology, such as speech software and special computers, also helps them to work.</p><p>Some people argue that disabled people need only pity. However, what they really need is opportunity and respect.</p><p>In conclusion, disabled people can be successful if they have determination, support and equal opportunities. We should all help to create such a society.</p>"}
],"Essay: introduction, 3 body paragraphs with examples, conclusion. 300 to 400 words is a safe target.")
]});

['ol',[`ရွေးမည့်မတိုင်မီ စကားပြောတစ်ခုလုံးကို တစ်ခါဖတ်ပါ။`,`ကွက်လပ်တစ်ခုချင်း၏ <b>အလုပ်</b> (နှုတ်ဆက်၊ အကြံတောင်း၊ အကြံပေး၊ သဘောတူ၊ တောင်းပန်၊ ကျေးဇူးတင်) ကို ရှာပါ။`,`စကားစုနှင့် အလုပ်ကို တွဲပါ။ သဒ္ဒါလည်း စစ်ပါ − <i>You ought to <b>spend</b></i>၊ <i>Why don’t you <b>take</b></i>၊ <i>How about <b>taking</b></i>။`,`ကွက်လပ်၏ <b>ရှေ့စာကြောင်း</b> နှင့် <b>နောက်စာကြောင်း</b> ကို သုံးပါ − ထိုနေရာတွင် အရိပ်အမြွက်ရှိပါတယ်။ သုံးပြီးသောစကားစုကို ဖြတ်ပါ။ တစ်ခု ပိုပါတယ်။`]],
