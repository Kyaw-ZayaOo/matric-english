/* ================= 7. GRAMMAR ================= */
const CARDS=[];
const GR=(title,formula,ex,warn,tryItem,my)=>CARDS.push({title,formula,ex,warn,tryItem,my});
const GH=(en,my)=>CARDS.push({h:[en,my]});

GH('Decoder: what does the bracket ask?','Decoder − ကွင်းထဲက ညွှန်ကြားချက်သည် ဘာကို တောင်းသလဲ');
CARDS.push({table:true});
GH('Patterns in the Grade 12 book','ဂရိတ် ၁၂ စာအုပ်ထဲက ပုံစံများ');
GR('Modals: can, should, must, mustn’t (Unit 1)',`<code>can / should / must + base verb</code>. can = ability, permission. should = advice. must = strong need. <b>mustn’t</b> = not allowed. <b>don’t have to</b> = not necessary.`,`You mustn’t enter the meeting room without permission.`,`mustn’t is not the same as don’t have to.`,M("You ______ smoke in public areas. It is forbidden.",["don’t have to","mustn’t","needn’t"],1,"Forbidden = mustn’t."),
 `can = စွမ်းရည်/ခွင့်ပြုချက်၊ should = အကြံပေးခြင်း၊ must = မဖြစ်မနေ၊ <b>mustn’t = မလုပ်ရ (တားမြစ်)</b>၊ don’t have to = မလုပ်လည်းရ။ mustn’t နှင့် don’t have to မတူပါ။`);
GR('Relative clauses and relative adverbs (Units 2, 12)',`Person: <code>who / whom / whose</code>. Thing: <code>which / that</code>. Place: <code>where</code>. Time: <code>when</code>. Reason: <code>why</code>. A clause <b>without commas</b> may use <i>that</i>. A clause <b>with commas</b> uses who/which, <b>never that</b>.`,`Inya Lake, which is very good for walking, is near my house.<br>Thadingyut is the Lighting Festival, <b>when</b> many people decorate buildings with paper lanterns.<br>A police officer <b>whose</b> car was parked at the corner arrested the robbers.`,`Do not use <i>that</i> after a comma. Use <i>whose</i> for belonging: the man <b>whose</b> son disappeared.`,R("Join with ‘whose’: The woman spent the night at a friend’s. Her flat was burgled.","The woman whose flat was burgled spent the night at a friend’s house.",[["the woman whose flat was burgled"],["spent the night"]],2),
 `လူ − who/whom/whose၊ အရာ − which/that၊ နေရာ − where၊ အချိန် − when၊ အကြောင်းရင်း − why။ comma မပါလျှင် that သုံးနိုင်ပါတယ်။ comma ပါလျှင် who/which သာ သုံးပါ (that မသုံးရ)။ <b>whose</b> သည် ပိုင်ဆိုင်မှု (his/her) အစား သုံးပါတယ်။`);
GR('Participle phrases (Unit 3)',`<code>V-ing …, clause</code> (same subject). <code>Having + past participle …, clause</code> (an earlier action). <code>Not + V-ing …</code> (negative).`,`The thief entered the house. He broke the door lock with a pocket knife. → <b>The thief entered the house, breaking the door lock with a pocket knife.</b><br>After she had finished the exam, she felt happy. → <b>Having finished the exam, she felt happy.</b><br>The manager has not received all the applications. → <b>Not having received all the applications, the manager …</b>`,`Both clauses must have the <b>same subject</b>.`,R("Use a participle phrase: After he had picked up his coat, he slowly went downstairs.","Having picked up his coat, he slowly went downstairs.",[["having picked up his coat"],["slowly went downstairs","went downstairs slowly"]],2),
 `အလုပ်နှစ်ခုကို subject တူလျှင် ပေါင်းနိုင်ပါတယ်။ <b>V-ing</b> (တစ်ပြိုင်နက်/အကြောင်းရင်း)၊ <b>Having + p.p.</b> (အရင်ဖြစ်သော အလုပ်)၊ <b>Not + V-ing</b> (အနုတ်)။ ဝါကျနှစ်ကြောင်း၏ subject တူရမယ်။`);
GR('Cleft sentences: It is / was … who / that (Unit 3)',`<code>It is/was + the emphasised part + who (person) / that + the rest</code>. The <u>underlined part</u> in the exam goes after “It was”.`,`Marie Curie discovered <u>radium</u>. → <b>It was radium that Marie Curie discovered.</b><br>Her reason for visiting me was <u>to borrow money</u>. → <b>It was to borrow money that she visited me.</b><br>The <u>acrobat</u> crossed the tightrope. → <b>It was the acrobat who crossed the tightrope.</b>`,`Do not change the rest of the sentence. The tense of is/was follows the original.`,R("Matric style: The former judge of the ICC won the prize in 2026. (underlined: The former judge of the ICC)","It was the former judge of the ICC who won the prize in 2026.",[["it was the former judge of the icc"],["who won"]],2),
 `မေးခွန်းတွင် မျဉ်းသားထားသော အပိုင်းကို “It was” နောက်တွင် ထားပါ။ လူဆိုရင် <b>who</b>၊ အရာဆိုရင် <b>that</b> သုံးပါ။ ကျန်သောအပိုင်းကို မပြောင်းပါနှင့်။ is/was သည် မူလဝါကျ၏ tense အတိုင်း။`);
GR('Not only … but also (Unit 3)',`Plain: <code>subject + verb + not only A but also B</code>. Starting with Not only: <code>Not only + helping verb + subject … , but + subject + also …</code> (turn the subject and the verb around).`,`This research generated new insights. It also led to discoveries. → <b>This research not only generated new insights but also led to groundbreaking discoveries.</b><br>Not only is she smart, but she is also very rich.`,`Forget to turn the subject and helping verb around after <i>Not only</i> at the start.`,R("Join: The hotel is cheap. It is also clean. (start with Not only)","Not only is the hotel cheap, but it is also clean.",[["not only is the hotel cheap"],["but it is also clean","but also clean"]],2),
 `<b>Not only … but also</b> = “…သာမက …လည်း”။ ဝါကျကို Not only နှင့် စလျှင် helping verb ကို subject ရှေ့သို့ ပြောင်းပါ (Not only <u>is the hotel</u> cheap, but …)။`);
GR('Adjectives with prepositions; -ed / -ing adjectives (Unit 4)',`-ed describes a <b>person’s feeling</b> (I am bored). -ing describes the <b>thing that causes it</b> (The lesson is boring). Learn the pairs: <code>frightened of, keen on, jealous of, worried about, annoyed with, satisfied with, bored with, embarrassed by, interested in, aware of</code>.`,`The teacher was annoyed with me about my careless mistakes.`,`jealous <b>of</b>, not with. bored <b>with</b>, not of.`,M("He was jealous ______ the wealth of other people.",["with","of","by"],1,"jealous of."),
 `-ed = လူ၏ ခံစားချက် (I am bored)၊ -ing = အကြောင်းရင်းဖြစ်သော အရာ (The lesson is boring)။ adjective + preposition အတွဲများကို တွဲမှတ်ပါ − jealous <b>of</b>၊ keen <b>on</b>၊ aware <b>of</b>၊ annoyed <b>with</b>။`);
GR('Conjunctions (Unit 5)',`Time: when, after, before, as soon as, until, while. Reason: because, since, as. Purpose: so that, in case. Result: <code>so + adj + that</code>, <code>such + (a) + adj + noun + that</code>. Condition: if, unless, provided that. Contrast: although, though, even though. Comparison: <code>(not) as … as</code>. Manner: as if, as though.`,`The story was very interesting. I read it in one sitting. → <b>The story was so interesting that I read it in one sitting.</b><br>It was a very long film. → <b>It was such a long film that I fell asleep.</b><br>My uncle speaks Japanese better than English. → <b>My uncle does not speak English as well as Japanese.</b>`,`Do not use <i>but</i> with <i>although</i>: “Although it rained, we went.”`,R("Join with ‘such … that’: It was a very long film. I fell asleep towards the end.","It was such a long film that I fell asleep towards the end.",[["such a long film that"],["fell asleep"],["towards the end"]],3),
 `<b>so + adj + that</b> / <b>such + a + adj + noun + that</b> = “အရမ်း…လို့…”။ <b>not as … as</b> = နှိုင်းယှဉ်မှု (ပိုမလိုတူ)။ although/even though = ဆန့်ကျင်ဘက်၊ ဒါပေမယ့် <b>although ဖြင့် but မသုံးရ</b>။`);
GR('No matter + wh-word (Unit 6)',`<code>No matter + who / what / which / where / when / how + clause, main clause</code>. After <b>no matter how</b> put the adjective or adverb first.`,`Although grammar exercises are difficult, I am determined to practise. → <b>No matter how difficult grammar exercises are, I am determined to practise them.</b><br>Please do not neglect any details even though they seem unimportant. → <b>No matter how unimportant they seem, please do not neglect any details.</b><br>He is found innocent or guilty. → <b>No matter whether he is found innocent or guilty, …</b>`,`Say <i>how difficult</i> they are. Not “how they are difficult”.`,R("Use ‘no matter how’: Life is hard. Please do not give up.","No matter how hard life is, please do not give up.",[["no matter how hard life is"],["do not give up","don't give up"]],2),
 `<b>No matter how + adjective</b> = “ဘယ်လောက်…ပေမယ့်”။ no matter ၏ နောက်တွင် adjective ကို အရင်ထားပါ (how difficult they are)။ no matter whether … or … ကိုလည်း သုံးနိုင်ပါတယ်။`);
GR('Cause and effect (Unit 7)',`Verbs: <code>cause, lead to, result in, bring about</code> + effect. Linking words: <code>because + clause</code>, <code>because of / due to / owing to / as a result of + noun</code>, <code>As a result, / Consequently, / As a consequence, + clause</code>.`,`There was a heavy rain. The roads were flooded. → The roads were flooded <b>as a result of</b> the heavy rain.<br>She failed to submit the assignment. She received a lower grade. → She failed to submit the assignment; <b>as a result</b>, she received a lower grade.`,`<i>because of</i> is followed by a noun, not a clause. <i>result in</i> points to the effect. <i>result from</i> points to the cause.`,R("Use ‘owing to’: The weather was extremely bad. The football match was cancelled.","The football match was cancelled owing to the extremely bad weather.",[["owing to the"],["match was cancelled"],["bad weather"]],3),
 `အကြောင်းရင်း → ရလဒ်။ <b>because + clause</b>၊ <b>because of / due to / owing to + noun</b>၊ <b>As a result, / As a consequence, + clause</b>။ result <b>in</b> = ရလဒ်ကို ညွှန်၊ result <b>from</b> = အကြောင်းရင်းကို ညွှန်။`);
GR('Conditionals (Unit 8) and unless',`Zero: <code>if + present, present</code>. First: <code>if + present, will + verb</code>. Second: <code>if + past (were), would + verb</code>. Third: <code>if + past perfect, would have + past participle</code>. <code>Unless = if … not</code>. When the bracket says “use the zero / first / second / third conditional”, choose by meaning: real and general → zero; possible in the future → first; unreal now → second; unreal in the past → third.`,`She didn’t switch on the lights, so she fell over the chair. → <b>If she had switched on the lights, she would not have fallen over the chair.</b><br>She does not find his phone number, so she does not call him. → <b>If she found his phone number, she would call him.</b>`,`Never put <i>would</i> in the if-clause. With <i>unless</i> do not add another negative.`,R("Third conditional: She didn’t switch on the lights, so she fell over the chair.","If she had switched on the lights, she would not have fallen over the chair.",[["if she had switched on the lights"],["would not have fallen","wouldn't have fallen"],["over the chair"]],3),
 `Zero = အမြဲမှန်သော အချက်၊ First = အနာဂတ်တွင် ဖြစ်နိုင်၊ Second = ယခု မဖြစ်နိုင်သော စိတ်ကူး (<b>were</b>)၊ Third = အတိတ်တွင် မဖြစ်ခဲ့သည်ကို စိတ်ကူး (<b>if + had + p.p., would have + p.p.</b>)။ if-clause ထဲတွင် would မထည့်ပါနှင့်။ <b>unless = if … not</b>။ ညွှန်ကြားချက်တွင် အမျိုးအစား မပြောပါက အဓိပ္ပာယ်ကို ကြည့်၍ ရွေးပါ။`);
GR('Verbs followed by noun group + infinitive (Unit 9)',`<code>make / let / have + object + base verb</code>. <code>help + object + (to) verb</code>. <code>ask / tell / want / allow + object + to + verb</code>.`,`Annie made Helen pick up the doll. / Annie wanted Helen to depend on her.`,`Not “made her to pick”. After make and let use the base verb.`,M("Please have the waiter ______ more bread.",["to bring","bring","bringing"],1,"have + object + base verb."),
 `make/let/have + object + <b>base verb</b> (to မပါ)။ ask/tell/want/allow + object + <b>to + verb</b>။`);
GR('Purpose (Unit 10)',`<code>to / in order to / so as to + base verb</code> (same subject). <code>in order not to / so as not to + base verb</code> (negative). <code>so that / in order that + clause</code> (can, could, will, would).`,`We went for a picnic yesterday <b>in order to</b> have a relaxed atmosphere. / He left early so that he could avoid the traffic.`,`Do not write “so that to”.`,M("He studied hard ______ he could pass with flying colours.",["so as to","so that","because of"],1,"A full clause follows, so use so that."),
 `ရည်ရွယ်ချက် − <b>to / in order to / so as to + verb</b> (subject တူလျှင်)၊ <b>so that + clause</b> (can/could/will/would ပါ)။ အနုတ်ရည်ရွယ်ချက် − <b>in order not to / so as not to</b>။`);
GR('as if / as though (Unit 11)',`<code>as if / as though + past (were)</code> for something not real. Use <b>were</b> for all subjects. If it is about an earlier time, use past perfect.`,`He runs and jumps like he has superpowers. → <b>He runs and jumps as if he had superpowers.</b><br>The baby talked to her toys as though they were alive.`,`Use <b>were</b> for all subjects in unreal comparisons.`,R("Use ‘as if’: The gardener whispered words of encouragement to his plants. He thought they were alive.","The gardener whispered words of encouragement to his plants as if they were alive.",[["as if they were alive","as though they were alive"],["whispered words of encouragement","whispered a few words of encouragement"]],2),
 `<b>as if / as though</b> = “…ကဲ့သို့”၊ အမှန်မဟုတ်သည့် နှိုင်းယှဉ်မှု။ နောက်တွင် <b>အတိတ်</b> (were/had) သုံးပါ။ အရင်ဖြစ်ပြီးသော အရာဆိုရင် past perfect (had + p.p.)။`);
GR('Introductory phrases (Unit 11)',`Put a phrase at the <b>start</b> of the sentence and end it with a comma. Kinds: infinitive (<i>To be a good leader, …</i>), participle (<i>Held in her hand, …</i>), prepositional (<i>In the morning, …</i>).`,`Our monitor should be considerate towards his classmates to be a good leader. → <b>To be a good leader, our monitor should be considerate towards his classmates.</b>`,`Do not forget the comma. Do not change the meaning.`,R("Use an introductory phrase: Our monitor should be a bit considerate towards his classmates to be a good leader.","To be a good leader, our monitor should be a bit considerate towards his classmates.",[["to be a good leader"],["our monitor should be a bit considerate"],["towards his classmates"]],3),
 `စကားစုတစ်ခုကို ဝါကျ <b>အစ</b> သို့ ရွှေ့ပြီး comma ခံပါ (To be a good leader, …)။ အဓိပ္ပာယ် မပြောင်းစေရ။`);
GH('Patterns from earlier grades that still come','အောက်တန်းမှ သဒ္ဒါများ (စာမေးပွဲတွင် ဆက်ပါသည်)');
GR('Reported speech',`Statement: <code>S + said (that) + clause moved back one tense</code>. Command: <code>told + person + to + verb</code> / <code>told + person + not to + verb</code>. Question: <code>asked + if/whether or wh-word + statement order</code>. Tenses move back: <b>now→then, today→that day, tomorrow→the next day, yesterday→the day before, here→there</b>. Pronouns change by meaning.`,`Father said to us, “Drink plenty of water because the weather is hot.” → <b>Father told us to drink plenty of water because the weather was hot.</b><br>He said to me, “When I reach the airport, I’ll call you.” → <b>He told me that when he reached the airport, he would call me.</b>`,`Do not keep “said to” for a command. Use told. In a question, do not use do/does/did: “asked if she <u>had come</u>”.`,R("Thuta said, “Please don’t tell my father that I did not attend the classes yesterday.”","Thuta asked me not to tell his father that he had not attended the classes the day before.",[["asked","told","begged"],["not to tell"],["had not attended","hadn't attended","had not attended the classes"]],3),
 `ပြောခဲ့သော စကားကို အလိုအလျောက် <b>အတိတ်ဘက်သို့ တစ်ဆင့်ပြန်</b> ပါ − am/is → was၊ will → would၊ did → had done။ အချိန်စကားများ ပြောင်းပါ (today → that day၊ tomorrow → the next day၊ yesterday → the day before၊ here → there)။ အမိန့်/တောင်းဆိုချက် − <b>told + လူ + to + verb</b>။ မေးခွန်း − <b>asked + if/whether</b> + ပုံမှန်ဝါကျအစီအစဉ်။`);
GR('Direct speech (from reported speech)',`The opposite of reported speech: <code>said/asked + comma + “words as they were spoken”</code>. Move the tense forward. <b>then→now, that day→today, the day before→yesterday, there→here</b>. Change pronouns back. Questions: put the question word and helping verb in front.`,`The air hostess told me that I was not allowed to sit in business class. → <b>The air hostess said to me, “You are not allowed to sit in business class.”</b><br>Zaw Zaw asked Mya Mya why she had not come the day before. → <b>Zaw Zaw said to Mya Mya, “Why didn’t you come yesterday?”</b>`,`Use quotation marks and a capital letter. A question needs a question mark inside the quotation marks.`,R("Change into direct speech: The air hostess told me that I was not allowed to sit in business class.","The air hostess said to me, “You are not allowed to sit in business class.”",[["said to me","told me","said"],["you are not allowed","you aren't allowed","you're not allowed"],["business class"]],3),
 `reported speech ၏ ပြောင်းပြန်ဖြစ်ပါတယ်။ <b>said to + လူ, “…”</b> ပုံစံဖြင့် ရေးပါ။ tense ကို တစ်ဆင့် ရှေ့သို့ ပြန်ပြောင်းပါ (was → am/is၊ had come → came/did come)။ then → now၊ the day before → yesterday။ အမှတ်အသား (“ ”) နှင့် စာလုံးကြီး မမေ့ပါနှင့်။`);
GR('Active to passive',`<code>object + be (same tense as the active verb) + past participle + (by agent)</code>. Present simple → <i>is/are + p.p.</i>. Present continuous → <i>is/are being + p.p.</i>. Past simple → <i>was/were + p.p.</i>. Present perfect → <i>has/have been + p.p.</i>. Two verbs: share the helping verb. Questions: <i>Did X rescue Y?</i> → <i>Was Y rescued by X?</i>`,`Workers weave silk thread into beautiful shirts. → <b>Silk thread is woven into beautiful shirts (by workers).</b><br>They renovated the old building and converted it into a cinema. → <b>The old building was renovated and converted into a cinema.</b><br>Did a passer-by rescue the stray puppy? → <b>Was the stray puppy rescued by a passer-by?</b>`,`Keep the same tense. Use the past participle (repaired, written, woven).`,R("Passive: Workers weave silk thread into beautiful shirts.","Silk thread is woven into beautiful shirts by workers.",[["silk thread is woven"],["into beautiful shirts"]],2),
 `object ကို subject အဖြစ် ရှေ့ထုတ်ပြီး <b>be + past participle</b> သုံးပါ။ tense ကို မူလအတိုင်း ထားပါ (weave → is woven၊ renovated → was renovated)။ ကြိယာ နှစ်လုံးရှိလျှင် be ကို မျှဝေသုံးနိုင်ပါတယ် (was renovated and converted)။ မေးခွန်းပါလျှင် be ကို ရှေ့ထားပါ (Was the puppy rescued by …?)။`);
GR('Passive questions with “who”',`<i>Who designed the plan?</i> → <i>By whom was the plan designed?</i>`,`Who wrote this letter? → <b>By whom was this letter written?</b>`,`Use <i>whom</i> after <i>by</i>.`,R("Passive: Who designed the strategy that led to the company’s success?","By whom was the strategy that led to the company’s success designed?",[["by whom was the strategy"],["designed"]],2,["Who was the strategy that led to the company's success designed by"]),
 `“Who + ကြိယာ …?” ကို passive ပြောင်းလျှင် <b>By whom was … + p.p.?</b> ဖြစ်ပါတယ်။`);
GR('Nouns in apposition',`A noun phrase put next to another noun to explain it, with commas on both sides: <code>Noun, noun phrase, verb …</code>. Make it from two sentences. Delete <i>It is</i>.`,`Tokyo offers its visitors an unlimited choice of shopping. Tokyo is the capital of Japan. → <b>Tokyo, the capital of Japan, offers its visitors an unlimited choice of shopping.</b>`,`Put commas on <b>both</b> sides.`,R("Use apposition: Mandalay is a city in Upper Myanmar. It is the last royal capital. (start with Mandalay)","Mandalay, the last royal capital, is a city in Upper Myanmar.",[["mandalay"],["the last royal capital","a last royal capital"],["city in upper myanmar"]],3),
 `ဝါကျနှစ်ကြောင်းကို ပေါင်းပါ။ ဒုတိယဝါကျ၏ “It is” ကို ဖြုတ်ပြီး နာမ်စကားစုကို ပထမနာမ်၏ ဘေးတွင် <b>comma နှစ်ဖက်</b> ခံ၍ ထည့်ပါ (Tokyo, the capital of Japan, offers …)။`);
GR('too … to / enough to',`<code>too + adj/adv + to + verb</code> (a negative meaning). <code>adj/adv + enough + to + verb</code> (a positive meaning).`,`U Mya earns very little. He cannot keep his family in comfort. → <b>U Mya earns too little to keep his family in comfort.</b><br>He worked very hard. He completed the project on time. → <b>He worked hard enough to complete the project on time.</b>`,`<i>too … to</i> already has a negative meaning. Do not add “not”.`,R("Use ‘too … to’: U Mya earns very little. He cannot keep his family in comfort.","U Mya earns too little to keep his family in comfort.",[["too little"],["to keep his family in comfort"]],2),
 `<b>too + adj + to + verb</b> = “…လွန်းလို့ …မရ” (အနုတ်အဓိပ္ပာယ်ပါပြီ၊ not မထည့်ပါနှင့်)။ <b>adj + enough + to + verb</b> = “…လောက်အောင် …” (အပြုသဘော)။`);
GR('both … and / neither … nor / either … or',`<code>Both A and B + plural verb</code>. <code>Neither A nor B</code> = two negatives. The verb agrees with the <b>nearer</b> subject. <code>Either A or B</code> = one of two.`,`The teachers were present. The headmaster was present. → <b>Both the teachers and the headmaster were present at the meeting.</b><br>I did not fall. I did not break my leg. → <b>I neither fell nor broke my leg while I was cycling.</b><br>I was not involved. He was not involved. → <b>Neither I nor he was involved in the project.</b>`,`With <i>neither … nor</i> do not add <i>not</i>.`,R("Use ‘neither … nor’: I did not fall while I was cycling. I did not break my leg while I was cycling.","I neither fell nor broke my leg while I was cycling.",[["neither fell nor broke","neither fell nor did i break"],["my leg"],["while i was cycling"]],3),
 `<b>Both A and B</b> = နှစ်ခုလုံး (plural ကြိယာ)၊ <b>Neither A nor B</b> = နှစ်ခုလုံး မဟုတ် (အနုတ်နှစ်ခု ပေါင်း၊ not မထည့်ပါနှင့်)၊ <b>Either A or B</b> = တစ်ခု။ ကြိယာသည် ပိုနီးသော subject နှင့် ကိုက်ညီရမည်။`);
GR('Time words: as soon as, no sooner … than, before, after, without + V-ing',`<code>No sooner had + S + p.p. + than + clause</code> = <code>As soon as + S + verb, clause</code>. <code>before / after + clause</code> or <code>before / after + V-ing</code>. <code>without + V-ing</code> = “if you do not …”.`,`No sooner had they had dinner than the ceiling crashed. → <b>As soon as they had had dinner, the ceiling crashed.</b><br>You will not be allowed in if you do not have your card. → <b>You will not be allowed in without having your card.</b><br>They checked the forecast. Then they went for a picnic. → <b>They checked the forecast before they went for a picnic.</b>`,`Keep the tense of the original sentence.`,R("Use ‘without + V-ing’: You will not be allowed to go into the library if you do not have your personal library card.","You will not be allowed to go into the library without having your personal library card.",[["without having your personal library card","without having a personal library card"],["not be allowed to go into the library"]],2),
 `<b>No sooner had … than …</b> = <b>As soon as …</b> (အဓိပ္ပာယ်တူ − “…တာနဲ့ …”)။ <b>before / after</b> + ဝါကျ သို့မဟုတ် V-ing။ <b>without + V-ing</b> = “…မရှိဘဲ” (if … not ၏ အဓိပ္ပာယ်)။`);
GR('Contrast and result: although, even though, however, as a result, as a consequence',`Contrast: <code>Although + clause, clause</code> (= However, …). Result: <code>…; as a result, …</code> / <code>as a consequence, …</code>. When the bracket lists “in order that / provided that / even though”, <b>choose the one that fits the meaning</b>.`,`Swiftlets are tiny birds. However, they can fly ten months without a break. → <b>Although swiftlets are tiny birds, they can fly ten months without a break.</b><br>I had two hours for shopping. I couldn’t find the suit I wanted. → <b>Even though I had two hours for shopping, I couldn’t find the suit I wanted.</b><br>The weather was bad. The event was cancelled. → <b>The weather was bad; as a consequence, the event was cancelled.</b>`,`Do not use <i>but</i> in the same sentence as <i>although</i>.`,R("Begin with ‘Although’: Swiftlets are tiny birds. However, they can spend ten months in flight without taking a break.","Although swiftlets are tiny birds, they can spend ten months in flight without taking a break.",[["although swiftlets are tiny birds"],["can spend ten months in flight"],["without taking a break"]],3),
 `<b>Although / even though + ဝါကျ, ဝါကျ</b> = “…ပေမယ့်”။ <b>as a result / as a consequence</b> = “ထို့ကြောင့်” (semicolon သို့မဟုတ် full stop ပြီးမှ ထည့်ပါ)။ ကွင်းထဲတွင် in order that / provided that / even though ပေးထားလျှင် <b>အဓိပ္ပာယ်နှင့် အကိုက်ညီသည်ကို</b> ရွေးပါ။`);
GR('The more … the more …',`<code>The + comparative + clause, the + comparative + clause</code>. Used for “if … more/less, … more/less”.`,`If the task is difficult, it is sweet to succeed. → <b>The more difficult the task is, the sweeter it is to succeed.</b>`,`Put <b>the</b> in both parts. Short adjectives take -er (sweeter). Long ones take more (more difficult).`,R("Use ‘The more … the …’: If you read a lot, you learn a lot.","The more you read, the more you learn.",[["the more you read"],["the more you learn"]],2),
 `<b>The + နှိုင်းယှဉ်ပုံစံ …, the + နှိုင်းယှဉ်ပုံစံ …</b> = “ပိုများလေ ပိုများလေ”။ နှစ်ပိုင်းလုံးတွင် the ထည့်ပါ။ အတိုစကားလုံး + -er (sweeter)၊ အရှည်စကားလုံး − more + adj (more difficult)။`);

const DECODER_EN=[
['as if / as though','Join the sentences. Use past (were / had) after it.'],
['as soon as / no sooner … than','Two actions, one right after the other.'],
['neither … nor / both … and / not only … but also','Join two similar ideas. See the cards.'],
['so … that / such … that','Result. so + adjective; such + (a) + adjective + noun.'],
['too … to / enough to','Too = negative result. Enough = positive result.'],
['in order to / so as to / in order that','Purpose.'],
['as a result / as a consequence','Result. Put it at the start of the second clause.'],
['although / even though','Contrast. No “but”.'],
['no matter how / who / what','“It does not matter …”. Adjective after how.'],
['The more / less … the …','Comparative pairs.'],
['It is / was … who / that','Put the underlined part after “It was”.'],
['a participle phrase','V-ing / Having + p.p. at the start. Same subject.'],
['nouns in apposition','Delete “It is”. Put the noun phrase between commas.'],
['an introductory phrase','Move a phrase to the start. Add a comma.'],
['a relative pronoun / adverb','who, which, whose, where, when. Check commas.'],
['the passive voice','be + past participle. Same tense.'],
['reported speech / direct speech','Move tenses back (reported) or forward (direct). Change time words and pronouns.'],
['the second / third conditional','if + past, would … / if + had + p.p., would have + p.p.'],
['without + V-ing / before','Short forms of “if … not” and time order.'],
['not as … as','Use the opposite comparison.']
];

['as soon as / no sooner … than','လုပ်ရပ်နှစ်ခု၊ တစ်ခုပြီးတာနဲ့ တစ်ခုဖြစ်သည်။'],
['neither … nor / both … and / not only … but also','အဓိပ္ပာယ်ဆင်တူ အချက်နှစ်ခု ပေါင်းပါ။ ကတ်များကို ကြည့်ပါ။'],
['so … that / such … that','ရလဒ်။ so + adjective၊ such + (a) + adjective + noun။'],
['too … to / enough to','too = အနုတ်ရလဒ်၊ enough = အပြုသဘော ရလဒ်။'],
['in order to / so as to / in order that','ရည်ရွယ်ချက်။'],
['as a result / as a consequence','ရလဒ်။ ဒုတိယဝါကျ၏ အစတွင် ထည့်ပါ။'],
['although / even though','ဆန့်ကျင်ဘက်။ “but” မသုံးရ။'],
['no matter how / who / what','“…ပေမယ့် ဘာမှမဟုတ်”။ how ၏နောက် adjective။'],
['The more / less … the …','နှိုင်းယှဉ်ပုံစံ တွဲ။'],
['It is / was … who / that','မျဉ်းသားထားသော အပိုင်းကို “It was” နောက်တွင် ထားပါ။'],
['a participle phrase','V-ing / Having + p.p. ကို အစတွင် ထားပါ။ subject တူရမည်။'],
['nouns in apposition','“It is” ဖြုတ်ပါ။ နာမ်စကားစုကို comma ကြားတွင် ထည့်ပါ။'],
['an introductory phrase','စကားစုကို အစသို့ ရွှေ့ပြီး comma ခံပါ။'],
['a relative pronoun / adverb','who, which, whose, where, when။ comma ကို စစ်ပါ။'],
['the passive voice','be + past participle။ tense တူရမည်။'],
['reported speech / direct speech','tense ကို နောက်ပြန် (reported) သို့မဟုတ် ရှေ့ပြန် (direct)။ အချိန်စကားနှင့် နာမ်စားများ ပြောင်းပါ။'],
['the second / third conditional','if + past, would … / if + had + p.p., would have + p.p.'],
['without + V-ing / before','“if … not” နှင့် အချိန်အစဉ်၏ အတိုပုံစံ။'],
['not as … as','ဆန့်ကျင်ဘက် နှိုင်းယှဉ်မှု သုံးပါ။']

const cardBlocks=(my)=>CARDS.map(c=>{
  if(c.h)return ['h3',my?c.h[1]:c.h[0]];
  if(c.table)return ['table',my?['ကွင်းထဲက စကားစု','လုပ်ရမည့်အရာ']:['The bracket says','What to do'],my?DECODER_MY:DECODER_EN];
  const inner=my
    ?[['p',c.my],['p',`<b>Formula:</b> ${c.formula}`],['ex',c.ex,'ဥပမာ'],['try',c.tryItem]]

SEC({short:'Poems',title:'The four poems',blocks:[
['p',`Poems give <b>5 to 7 marks</b>: 5 for completing lines (Part IV A) and often 1 for “What do these lines mean?” in Part IV(B). The same lines come back in many papers. Learn the poems one stanza at a time and read them aloud.`],
['acc','Poem 2: The Quiet Life (Alexander Pope)',[
['ul',[`<b>Theme:</b> a happy man is content with a small piece of land and a quiet, simple life.`,`<b>Form:</b> five stanzas of four lines. Rhyme scheme <b>ABAB</b> (care / air, bound / ground, find / mind, away / day, live / die).`,`<b>Stanza 1:</b> the happy man has a few acres from his father. He is content to breathe the air of his own place.`,`<b>Stanza 2:</b> his herds give milk, his fields give bread, his flocks give clothes, his trees give shade in summer and fire in winter.`,`<b>Stanza 3:</b> he is blessed who spends hours, days and years without worry, with a healthy body, a peaceful mind and quiet by day.`,`<b>Stanza 4:</b> sound sleep at night, study and ease, sweet recreation, innocence and meditation.`,`<b>Last stanza:</b> “let me live unseen and unknown, and die without being mourned”. No gravestone should tell where he lies.`,`<b>Message:</b> happiness comes from a simple, peaceful, content life, not from fame or wealth.`]]]],
['acc','Poem 3: The Road Not Taken (Robert Frost)',[
['ul',[`<b>Theme:</b> life is full of choices. Each choice shapes our future.`,`<b>Form:</b> four stanzas of five lines. Rhyme scheme <b>ABAAB</b>.`,`<b>Story:</b> in a yellow wood a traveller finds two roads. He is sorry he cannot take both. He looks down one road as far as he can. Then he takes the other. It looks less worn, but both are about the same. He keeps the first for another day, but he knows he will probably never return. Years later he will say he took the road less travelled “and that has made all the difference”.`,`<b>Meaning:</b> the road stands for a choice in life. The speaker accepts his choice and its results.`,`<b>Key lines:</b> “Two roads diverged in a yellow wood” · “And sorry I could not travel both” · “Oh, I kept the first for another day!” · “I took the one less travelled by, / And that has made all the difference.”`]]]],
['acc','Poem 4: Windy Nights (Robert Louis Stevenson)',[
['ul',[`<b>Theme:</b> a mysterious rider gallops through the night when the wind is high. The poem is about the sound and mood of a windy night.`,`<b>Form:</b> two stanzas of six lines (a sestet). Rhyme scheme <b>ABABCC</b>: set / wet, high / by, out / about.`,`<b>Repetition:</b> “gallop” is repeated to copy the sound of the horse’s feet and the endless wind.`,`<b>“When the fires are out”:</b> late at night, when people are in bed and the house fire has died down.`,`<b>Trees crying aloud; ships tossed at sea:</b> the wind is so strong that trees make loud noises and the sea is rough.`,`<b>Message:</b> the power of nature, and how the imagination turns the wind into a rider.`]]]],
['acc','Poem 1: The Library',[
['p',`This page was not clear in the scanned book, so only a short note is given here. Learn this poem from your own textbook. Use the same method: the theme in one sentence, the rhyme scheme, each stanza in one sentence. Past papers used lines about <i>what a library offers</i>: that books bring a whole world to the reader. Learn the whole poem, because both parts of the exam (completing lines and “What do these lines mean?”) can use it.`]]],
['h3','Practice: lines that came again and again'],
['p',`Fill in the missing word. These lines were used in several past papers.`],
['try',F("Happy the man, whose wish and care<br>A few paternal acres ______,","bound","Bound rhymes with ground in the next line.")],
['try',F("Content to breathe his native air<br>In his own ______;","ground")],
['try',F("Whose herds with milk, whose fields with bread,<br>Whose flocks supply him with ______;","attire")],
['try',F("Sound sleep by night; study and ______,<br>Together mix’d; sweet recreation,","ease")],
['try',F("Thus let me live, unseen, unknown;<br>Thus ______ let me die;","unlamented")],
['try',F("Two roads ______ in a yellow wood,<br>And sorry I could not travel both","diverged")],
['try',F("And looked down one as far as I could<br>To where it bent in the ______;","undergrowth")],
['try',F("I shall be telling this with a sigh<br>Somewhere ages and ages ______:","hence")],
['try',F("Late in the night when the ______ are out,<br>Why does he gallop and gallop about?","fires")],
['try',F("All night long in the dark and wet,<br>A man goes ______ by.","riding")],
['try',F("Whenever the trees are crying aloud,<br>And ships are ______ at sea,","tossed")],
['try',F("And both that morning equally lay<br>In leaves no step had trodden ______.","black")],
['h3','How to answer “What do these lines mean?”'],

SEC({short:'Letters',title:'Letters (10 marks)',blocks:[
['p',`Letters are worth 10 marks. You write 150–250 words (never more than 300). The reader is a friend, an aunt, an uncle or a sister.`],
['ex',`<div style="text-align:right">No. 9, Samar Street,<br>Myitkyina.<br>15th November 2026</div><p>Dear Thu Thu,</p><p><b>Paragraph 1:</b> greeting + the reason for writing.</p><p><b>Paragraph 2:</b> the main news, with details.</p><p><b>Paragraph 3:</b> advice, request or invitation.</p><p><b>Paragraph 4:</b> a polite ending (“Please write back soon.”).</p><p>Yours sincerely,<br>Marlar Nwe</p>`,'The format'],
['ul',[`Write the <b>address given in the question</b> at the top right.`,`Answer <b>every point</b> of the question. If it asks for two things (for example “tell her about … and ask her to …”), do both.`,`Friendly tone for friends and cousins. Respectful tone for aunts and uncles. Ending: <i>Yours sincerely / Yours lovingly / With love</i>.`,`A letter to a friend can use short forms (I’m, don’t). Keep the language simple and clear.`]],
['h3','Types of letters seen in past papers'],

['h3','Model letters'],
['acc','1. Saying sorry to an aunt (a missed birthday party)',[
['ex',`<div style="text-align:right">No. 72, Pyay Road,<br>Yangon.<br>15th November 2026</div><p>Dear Aunt,</p><p>How are you? I hope you are well. I am writing to say sorry. I could not come to your 63rd birthday party last week.</p><p>I really wanted to be there. Unfortunately, I had a high fever on that day. The doctor told me to rest at home for three days, so I could not travel. I felt very sad because I know the party was important to you.</p><p>Please forgive me. I have sent you a small gift by post. I hope you like it. I will visit you next month, and then we can celebrate together.</p><p>Happy birthday again! Please take care of your health.</p><p>With love,<br>Yadanar</p>`,'Model (about 125 words)']]],
['acc','2. Thanking an aunt for a smartphone',[
['ex',`<div style="text-align:right">No. 23, Thitsar Street,<br>Taunggyi.<br>15th November 2026</div><p>Dear Aunt,</p><p>How are you? I hope you and the family are well in Japan. I am writing to thank you for the smartphone. It arrived yesterday, and I am very happy.</p><p>I really appreciate your kindness. The phone is very useful for my studies. I can look up new words, watch lessons online and read news in English. It also helps me in my social life, because I can send messages and photos to my friends.</p><p>I will use it carefully and only for good things. Please give my regards to my uncle and my cousins.</p><p>Thank you again.</p><p>Yours lovingly,<br>Mya Thway</p>`,'Model (about 125 words)']]],
['acc','3. Inviting friends to stay for a weekend',[
['ex',`<div style="text-align:right">No. 7, Main Road,<br>Nyaung-pin-tha Village.<br>15th November 2026</div><p>Dear Lin Htet,</p><p>How are you? I hope you are well. I am writing to invite you and your friends to stay with me for a weekend. My village is quiet and beautiful, and I want you to see it.</p><p>We can do many things together. On Saturday morning we can walk along the river and swim. In the afternoon we can ride bicycles through the fields. In the evening we can have a barbecue and sing songs. On Sunday we can visit the old pagoda.</p><p>I want you to come because we have not met for a long time. Please let me know when you can come. My parents will be happy to meet you.</p><p>Write back soon.</p><p>Your friend,<br>Aung Myo</p>`,'Model (about 135 words)']]],
['acc','4. Encouraging a sister who is preparing for exams',[
['ex',`<div style="text-align:right">No. 9, Pagoda Road,<br>Pyin Oo Lwin.<br>15th November 2026</div><p>Dear Yadana,</p><p>How are you? I hope you are not working too hard. I heard that you are preparing for your exams, so I am writing to give you some encouragement.</p><p>Please don’t worry. You are a clever girl, and I am sure you will do well. Here is my advice. Make a timetable and study a little every day. Learn the textbook well, because most questions come from it. Practise with past papers, and write down your mistakes. Sleep at least seven hours, eat good food and take a short walk every day.</p><p>If you feel tired or sad, call me. I am always here to help.</p><p>Good luck!</p><p>With love,<br>Nilar</p>`,'Model (about 135 words)']]],
['h3','Check before you finish'],

['acc','1. Word order is fixed',[['p',`English is <b>Subject + Verb + Object</b>. A change of order changes the meaning. Adjectives go before nouns (<i>a renewable source</i>). Adverbs often go after the verb. The order changes only in special patterns (<i>Not only is she …</i>, questions).`]]],

['acc','3. Words that go together',[['p',`We say <i>make a mistake</i>, <i>do homework</i>, <i>heavy rain</i>, <i>pay respect</i>, <i>pass with flying colours</i>, <i>cause damage</i>. A word may be right in meaning but wrong in company. Learn pairs, not single words.`]]],
['acc','4. Small words matter (prepositions)',[['p',`Verbs, nouns and adjectives take fixed prepositions: <i>depend <b>on</b>, keen <b>on</b>, jealous <b>of</b>, afraid <b>of</b>, aware <b>of</b>, associated <b>with</b>, result <b>in</b></i>. Learn each new word with its preposition.`]]],
['acc','5. Tense shows time',[['p',`Reported speech moves tenses back. Conditionals use special tense pairs. Perfect forms show that one event came before another. When you rewrite a sentence, check that the tenses still match the time words.`]]],

['acc','8. A complete sentence needs a subject and a verb',[['p',`When the exam says “complete sentence”, write a subject and a verb, start with a capital letter and end with a full stop. “For a pleasant atmosphere” is not complete. “Good manners are vital for a pleasant atmosphere” is complete.`]]],
